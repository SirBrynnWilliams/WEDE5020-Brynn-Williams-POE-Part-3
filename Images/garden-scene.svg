<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#c9e0e4"/><stop offset=".72" stop-color="#f4eee0"/><stop offset="1" stop-color="#d9dfc6"/></linearGradient>
    <linearGradient id="lawn" x2="0" y2="1"><stop stop-color="#aebd82"/><stop offset="1" stop-color="#83975f"/></linearGradient>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f1e6ce"/><stop offset="1" stop-color="#d9c8a7"/></linearGradient>
  </defs>

  <!-- A soft sky and low sun keep the garden in the background. -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1300" cy="170" r="104" fill="#f6d995" opacity=".55"/>
  <circle cx="1300" cy="170" r="73" fill="#f4cf79" opacity=".55"/>
  <g fill="#fffdf5" opacity=".66">
    <path d="M220 205c0-35 48-48 70-21 19-36 77-23 78 18 42-4 56 50 17 64H249c-39-3-47-42-29-61z"/>
    <path d="M875 125c8-32 52-39 71-11 25-35 74-17 72 17 39-1 52 45 17 59H899c-34-6-39-42-24-65z"/>
  </g>

  <!-- Distant hills establish the horizon behind the home and play garden. -->
  <path d="M0 492q175-104 360-23t360 3q185-100 367-6t513-31v465H0Z" fill="#b6c49a" opacity=".72"/>
  <path d="M0 558q223-100 450-5t425-7q229-88 395-2t330-22v378H0Z" fill="#9eaf7b" opacity=".72"/>
  <path d="M0 622q239-67 480 5t472-5q272-77 648-4v282H0Z" fill="url(#lawn)" opacity=".78"/>

  <!-- Jah's welcoming first home, set back gently in the garden. -->
  <g class="jah-home" opacity=".84">
    <path d="M265 456l218-142 218 142v255H265Z" fill="url(#wall)" stroke="#8f8067" stroke-width="8"/>
    <path d="M230 463l253-174 253 174-25 31-228-155-228 155Z" fill="#78885d" stroke="#69764f" stroke-width="7"/>
    <path d="M442 568h83v143h-83z" fill="#8c7359"/>
    <circle cx="507" cy="641" r="5" fill="#f4d685"/>
    <g fill="#b9d4d5" stroke="#93876c" stroke-width="8">
      <path d="M306 504h79v78h-79z"/><path d="M581 504h79v78h-79z"/>
    </g>
    <path d="M345 504v78m-39-39h79m235-39v78m-39-39h79" stroke="#f5efe1" stroke-width="6"/>
    <rect x="360" y="418" width="244" height="44" rx="8" fill="#f5eedc" stroke="#8b7656" stroke-width="4"/>
    <text x="482" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#5b683c">JAH HOME</text>
    <path d="M245 710h438" stroke="#8b7656" stroke-width="8"/>
  </g>

  <!-- Quiet trees frame the distant building without crowding the page. -->
  <g opacity=".52">
    <path d="M177 597V348m-28 249 28-170 30 170" stroke="#76694e" stroke-width="18" fill="none"/>
    <circle cx="177" cy="344" r="74" fill="#829665"/><circle cx="128" cy="380" r="48" fill="#91a474"/><circle cx="222" cy="385" r="48" fill="#91a474"/>
    <path d="M1435 609V350m-28 259 28-174 30 174" stroke="#76694e" stroke-width="18" fill="none"/>
    <circle cx="1435" cy="346" r="78" fill="#829665"/><circle cx="1382" cy="386" r="48" fill="#91a474"/><circle cx="1487" cy="389" r="48" fill="#91a474"/>
  </g>

  <!-- Flower patches along the lawn. -->
  <g stroke="#70884c" stroke-width="5" fill="none" opacity=".72">
    <path d="M90 860v-62m30 62v-45m1370 45v-59m35 59v-43"/>
  </g>
  <g fill="#f7eee0" opacity=".85">
    <circle cx="90" cy="791" r="11"/><circle cx="76" cy="800" r="10"/><circle cx="103" cy="803" r="10"/><circle cx="90" cy="806" r="7" fill="#d6a851"/>
    <circle cx="1500" cy="795" r="11"/><circle cx="1487" cy="805" r="10"/><circle cx="1514" cy="807" r="10"/><circle cx="1500" cy="810" r="7" fill="#d6a851"/>
  </g>

  <!-- An original garden girl, inspired by the child in the Jah logo. -->
  <g class="garden-character">
    <ellipse cx="0" cy="832" rx="35" ry="9" fill="#43503a" opacity=".2"/>
    <g class="leg leg-back"><path d="M-9 774l-18 47" stroke="#573d35" stroke-width="14" stroke-linecap="round"/><path d="M-27 821l-18 8" stroke="#3c6273" stroke-width="12" stroke-linecap="round"/></g>
    <path d="M-25 682q25-17 51 0l20 94q-46 22-91 0z" fill="#e9a52e" stroke="#8b5d2b" stroke-width="4"/>
    <path d="M-25 700l-29 42m78-42 35 27" stroke="#784c3b" stroke-width="14" stroke-linecap="round"/>
    <g class="arm-play"><path d="M59 727l20-39" stroke="#784c3b" stroke-width="13" stroke-linecap="round"/><path d="M79 688l-2-27" stroke="#784c3b" stroke-width="9" stroke-linecap="round"/><path d="M76 660q-18-17-22-2t21 14q1-21 18-17t-12 24" fill="#f7e7b0" stroke="#8b773b" stroke-width="3"/></g>
    <g class="leg leg-front"><path d="M18 774l18 47" stroke="#573d35" stroke-width="14" stroke-linecap="round"/><path d="M36 821l19 8" stroke="#3c6273" stroke-width="12" stroke-linecap="round"/></g>
    <circle cx="0" cy="625" r="43" fill="#754934"/>
    <circle cx="-33" cy="594" r="23" fill="#35251f"/><circle cx="33" cy="594" r="23" fill="#35251f"/>
    <path d="M-35 621q1-42 35-42q34 2 35 42v12q-1 42-35 42q-34-1-35-42z" fill="#81513b"/>
    <path d="M-27 628q10-9 20 0m14 0q10-9 20 0" fill="none" stroke="#35251f" stroke-width="4" stroke-linecap="round"/>
    <path d="M-15 650q15 18 30 0" fill="none" stroke="#fff0d4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-19" cy="643" r="6" fill="#cf7660" opacity=".8"/><circle cx="19" cy="643" r="6" fill="#cf7660" opacity=".8"/>
  </g>

  <style>
    .garden-character { animation: garden-walk 38s linear infinite; transform-box: view-box; }
    .leg { transform-box: fill-box; transform-origin: top center; animation: step .55s ease-in-out infinite alternate; }
    .leg-front { animation-delay: -.55s; }
    .arm-play { transform-box: fill-box; transform-origin: 0% 20%; animation: wave 1.5s ease-in-out infinite alternate; }
    @keyframes garden-walk { from { transform: translateX(-100px); } to { transform: translateX(1640px); } }
    @keyframes step { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
    @keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(14deg); } }
    @media (prefers-reduced-motion: reduce) { .garden-character, .leg, .arm-play { animation: none; } }
  </style>
</svg>
